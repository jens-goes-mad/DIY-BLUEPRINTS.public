<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Branch Admin</title>
    <style>
      body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; color: #222; }
      h1 { font-size: 1.3rem; }
      a.back { font-size: 0.9rem; color: #555; }
      section { border: 1px solid #ccc; border-radius: 6px; padding: 1rem 1.2rem; margin: 1.5rem 0; }
      section h2 { margin-top: 0; font-size: 1.05rem; }
      label { display: block; font-size: 0.85rem; color: #444; margin: 0.6rem 0 0.2rem; }
      select, input[type="text"] { font: inherit; padding: 0.35rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
      button { font: inherit; margin-top: 1rem; padding: 0.45rem 1rem; border: 1px solid #444; border-radius: 4px; background: #222; color: #fff; cursor: pointer; }
      button:hover { background: #444; }
      ul#branch-list { padding-left: 1.2rem; }
      #create-result, #merge-result { margin-top: 0.8rem; font-size: 0.9rem; white-space: pre-wrap; }
      .ok { color: #1a7a1a; }
      .err { color: #b00020; }
      table.conflicts { border-collapse: collapse; width: 100%; margin-top: 0.5rem; font-size: 0.85rem; }
      table.conflicts th, table.conflicts td { border: 1px solid #ddd; padding: 0.3rem 0.5rem; text-align: left; }
      table.conflicts th { background: #f7f7f7; }
    </style>
  </head>
  <body>
    <a class="back" href="/">&larr; Back to editor</a>
    <h1>Branch admin</h1>

    <section>
      <h2>Branches</h2>
      <ul id="branch-list"><li>loading...</li></ul>
    </section>

    <section>
      <h2>Create branch</h2>
      <label for="new-branch-name">New branch name</label>
      <input type="text" id="new-branch-name" placeholder="e.g. feature-redesign" />
      <label for="from-branch">From branch</label>
      <select id="from-branch"></select>
      <button id="create-branch-btn" type="button">Create branch</button>
      <div id="create-result"></div>
    </section>

    <section>
      <h2>Merge branches</h2>
      <label for="source-branch">Source branch (merged from)</label>
      <select id="source-branch"></select>
      <label for="target-branch">Target branch (merged into)</label>
      <select id="target-branch"></select>
      <label for="merge-author">Your name (for the commit)</label>
      <input type="text" id="merge-author" placeholder="e.g. Jens" />
      <button id="merge-btn" type="button">Merge</button>
      <div id="merge-result"></div>
    </section>

    <script src="/admin.js"></script>
  </body>
</html>
