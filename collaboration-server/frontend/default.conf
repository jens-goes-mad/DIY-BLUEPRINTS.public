# This whole app is a locally-served dev prototype, rebuilt and
# redeployed constantly -- there's no legitimate reason for a browser to
# cache anything here, and stock nginx's default static-file caching
# behavior (conditional GET via ETag/Last-Modified, which a browser can
# still skip entirely and serve straight from disk cache) has caused real
# confusion twice now: a change gets deployed, curl/a fresh headless
# browser see it immediately, but an already-open or freshly-opened
# (non-incognito) browser tab keeps rendering the previous version until
# a hard refresh. Disabling caching outright removes the ambiguity.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ =404;
    }
}
