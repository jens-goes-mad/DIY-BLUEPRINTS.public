<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Collaborative Editor</title>
    <style>
      body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; }
      #user-badge { font-weight: bold; margin-bottom: 1rem; }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
        border: 1px solid #ccc;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        padding: 0.4rem;
        background: #f7f7f7;
      }
      #toolbar button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.3rem 0.55rem;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
      }
      #toolbar button:hover { background: #e8e8e8; }
      #toolbar button.is-active { background: #dbe7ff; border-color: #7fa8ff; }
      .toolbar-divider { width: 1px; height: 1.4rem; background: #ccc; margin: 0 0.2rem; }
      #editor { border: 1px solid #ccc; border-radius: 0 0 4px 4px; padding: 1rem; min-height: 300px; }
      #editor .ProseMirror { outline: none; }
      #editor h1, #editor h2, #editor h3 { margin: 0.4em 0; }
      #editor blockquote { border-left: 3px solid #ccc; margin: 0.5em 0; padding-left: 1em; color: #555; }
      #editor pre { background: #2d2d2d; color: #f2f2f2; padding: 0.6em; border-radius: 4px; overflow-x: auto; }
      #editor code { background: rgba(0,0,0,0.06); padding: 0.1em 0.3em; border-radius: 3px; }
      #editor pre code { background: none; padding: 0; }
      .collaboration-cursor__caret { position: relative; margin-left: -1px; margin-right: -1px; border-left: 1px solid; border-right: 1px solid; word-break: normal; pointer-events: none; }
      .collaboration-cursor__label { position: absolute; top: -1.4em; left: -1px; font-size: 12px; font-style: normal; font-weight: 600; line-height: normal; user-select: none; white-space: nowrap; color: #fff; padding: 0.1rem 0.3rem; border-radius: 3px 3px 3px 0; }
    </style>
  </head>
  <body>
    <div id="user-badge">connecting...</div>
    <div id="toolbar"></div>
    <div id="editor"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
